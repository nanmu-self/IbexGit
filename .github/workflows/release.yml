name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: '${{ matrix.label }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64 NSIS)
            artifact: windows-x64
            updater_target: windows-x86_64
          - os: macos-latest
            label: macOS (arm64 DMG)
            artifact: macOS-arm64
            updater_target: darwin-aarch64
          - os: ubuntu-latest
            label: Linux (x64 AppImage + deb)
            artifact: linux-x64
            updater_target: linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-3-dev

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundle
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm tauri build

      - name: Show build outputs
        shell: bash
        run: |
          echo "=== Bundle artifacts ==="
          find src-tauri/target/release/bundle -type f 2>/dev/null || echo "(bundle dir not found)"
          echo ""
          echo "=== Updater artifacts ==="
          find src-tauri/target/release/updater-release -type f 2>/dev/null || echo "(updater-release dir not found)"

      # upload-artifact 用独立 path 列表代替 brace glob（跨 runner shell 兼容）
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/updater-release/*
          if-no-files-found: warn
          retention-days: 7

  finalize:
    name: 创建 Release 并上传
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # merge-multiple 把所有 artifact 平铺到 artifacts/ 根目录
          # 避免 artifacts/windows-x64/..., artifacts/macOS-arm64/... 多层嵌套
          merge-multiple: true

      - name: 列出所有 artifacts
        run: |
          echo "=== 所有下载的 artifacts ==="
          ls -lh artifacts/

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: IbexGit ${{ github.ref_name }}
          body: |
            **IbexGit** — 本地优先的 Git 图形客户端（Tauri 2 + SvelteKit 5）

            ## 下载

            | 平台 | 文件 | 自动更新 |
            |------|------|---------|
            | Windows x64 (NSIS) | `ibexgit_*_x64-setup.exe` | ✅ 支持 |
            | macOS Apple Silicon (DMG) | `ibexgit_*_aarch64.dmg` | ✅ 支持 |
            | Linux x64 (AppImage) | `ibexgit_*_amd64.AppImage` | ⚠️ 部分支持 |
            | Linux x64 (deb) | `ibexgit_*_amd64.deb` | ❌ 不支持 |

            ## 自动更新机制

            本 Release 包含各平台的 `latest.<target>.json` + `.sig` 文件。
            客户端内置 updater 会从 `https://github.com/nanmu-self/IbexGit/releases/latest/download/latest.{target}.json`
            获取对应平台的更新元数据并校验签名。

            ## 构建信息

            - **Tag**: ${{ github.ref_name }}
            - **Commit**: ${{ github.sha }}
            - **Runner**: GitHub Actions (windows-latest + macos-latest + ubuntu-latest)

          files: |
            artifacts/*.exe
            artifacts/*.sig
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.json
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
