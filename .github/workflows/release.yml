name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: '${{ matrix.label }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64 NSIS)
            args: ''
          - os: macos-latest
            label: macOS (arm64 DMG)
            args: '--target aarch64-apple-darwin'
          - os: ubuntu-latest
            label: Linux (x64 AppImage + deb)
            args: ''

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-3-dev patchelf xdg-utils

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: src-tauri
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'IbexGit ${{ github.ref_name }}'
          releaseBody: |
            **IbexGit** — 本地优先的 Git 图形客户端（Tauri 2 + SvelteKit 5）

            ## 下载

            | 平台 | 文件 | 自动更新 |
            |------|------|---------|
            | Windows x64 (NSIS) | `ibexgit-*-setup.exe` + `latest.windows-x86_64.json` | ✅ 支持 |
            | macOS Apple Silicon (DMG) | `ibexgit-*.dmg` + `latest.darwin-aarch64.json` | ❌ DMG 不支持 updater |
            | Linux x64 (AppImage) | `ibexgit-*.AppImage` + `latest.linux-x86_64.json` | ✅ 支持 |
            | Linux x64 (deb) | `ibexgit-*.deb` | ❌ 不支持 |

            ## 自动更新机制

            本 Release 包含各平台的 `latest.<target>.json` + `.sig` 文件。
            客户端内置 updater 会从 `https://github.com/nanmu-self/IbexGit/releases/latest/download/latest.{target}.json`
            获取对应平台的更新元数据并校验签名。

            > 💡 **macOS DMG 说明**：Tauri updater 不支持 DMG，仅 App (.app.tar.gz) 格式可用。
            > 如需 macOS 自动更新，后续可在 tauri.conf.json targets 中加 `app`。

            ## 构建信息

            - **Tag**: ${{ github.ref_name }}
            - **Commit**: ${{ github.sha }}
            - **Runner**: ${{ matrix.label }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
