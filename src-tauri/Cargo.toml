[package]
name = "ibexgit"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# 双 bin 目标（主程序 + credential-helper，P7）下 `cargo run`/`tauri dev` 的
# 默认选择，否则报 "could not determine which binary to run"。
default-run = "ibexgit"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ibexgit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
specta = { version = "2.0.0-rc", features = ["derive", "serde_json"] }
tauri-specta = { version = "2.0.0-rc", features = ["javascript", "typescript", "derive"] }
specta-typescript = "0.0.12"
notify = "6"
regex = "1"
tokio = { version = "1", features = ["full"] }
keyring = "3"
getrandom = "0.3"
bitflags = "2"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
# AI Provider 管线（P11，ADR-013）：rustls 避免 OpenSSL 跨平台编译问题；
# stream 供 SSE 流式解析；默认继承环境代理（reqwest 内建 env proxy 读取）。
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "stream",
  "json",
  "http2",
  "charset",
] }
futures-util = { version = "0.3", default-features = false }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2.3.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
tauri = { version = "2", features = ["test"] }
wiremock = "0.6"
